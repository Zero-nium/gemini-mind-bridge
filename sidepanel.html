<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind Bridge</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #1f1f1f;
      --border-color: #e0e0e0;
      --primary-color: #1a73e8;
      --primary-disabled: #a0c3ff;
      --error-color: #d93025;
      --error-bg: #fce8e6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 13px;
    }

    h2 {
      margin-top: 0;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      font-size: 11px;
      font-weight: normal;
      padding: 2px 8px;
      border-radius: 12px;
      background: #e8eaed;
      color: #5f6368;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background-color: var(--primary-color);
      color: white;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background-color 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background-color: #1557b0;
    }

    .btn:disabled {
      background-color: var(--primary-disabled);
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f1f3f4;
    }

    .draft-box {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f1f3f4;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 8px;
    }

    .error-card {
      background: var(--error-bg);
      border: 1px solid #f5c6cb;
      color: var(--error-color);
      padding: 10px;
      border-radius: 6px;
      margin-top: 8px;
      display: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <h2>
    Mind Bridge
    <span id="statusBadge" class="status-badge">Idle</span>
  </h2>

  <div class="card">
    <button id="askMindBtn" class="btn">Ask Mind</button>
  </div>

  <div id="draftCard" class="card hidden">
    <strong>Draft Reply</strong>
    <div id="draftDisplay" class="draft-box"></div>
    <button id="insertDraftBtn" class="btn">Insert Draft</button>
    <button id="copyDraftBtn" class="btn btn-secondary">Copy to Clipboard</button>
  </div>

  <div id="errorCard" class="error-card">
    <strong id="errorTitle">Error</strong>
    <div id="errorMessage"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
